# Production stack: Postgres + the Fastify server + the web client + Caddy as a reverse
# proxy handling TLS automatically, routing both API and web traffic under the same
# DOMAIN by path (see the root Caddyfile). See docs/deployment.md for the full
# walkthrough.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in POSTGRES_PASSWORD, JWT_SECRET, DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# `name` is set explicitly (rather than defaulting to the directory name) so this never
# collides with docker-compose.yml's dev stack if both are ever run on the same machine —
# without it, both files default to the same project name and service name "postgres",
# which makes Compose treat them as the same container and replace one with the other.
name: clocker-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: clocker
    volumes:
      - clocker-postgres-prod:/var/lib/postgresql/data
    # No host port published — only the `server` container needs to reach this, over the
    # compose network, not your host machine.

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://clocker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/clocker?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      PORT: 3001
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.prod to your server's hostname}
    depends_on:
      - postgres

  # Static build of the web client (see web/Dockerfile), served by its own small Caddy —
  # not published to the host itself; the main `caddy` service below reaches it over the
  # compose network and is the only thing exposed outside this stack.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN:?set DOMAIN in .env.prod to your server's hostname}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod to your server's hostname}
      # The host agent (scripts/host-agent.mjs) runs on the host, not in
      # this stack — see docs/deployment.md#the-host-agent for why —
      # so Caddy reaches it via host.docker.internal (mapped below) instead of a compose
      # service name.
      HOST_AGENT_PORT: ${HOST_AGENT_PORT:-4001}
    extra_hosts:
      # Docker Desktop provides host.docker.internal natively; on Linux this mapping is
      # required for a container to reach a process bound to the host itself.
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
      - web

volumes:
  clocker-postgres-prod:
  caddy-data:
  caddy-config:
